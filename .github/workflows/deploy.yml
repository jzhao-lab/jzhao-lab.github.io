name: Publish Zhao Lab website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble and verify Lovable export
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/website"
          cp -R public/assets "$RUNNER_TEMP/website/assets"
          unzip -oq website-export.zip -d "$RUNNER_TEMP/website"
          cp googleb15b0711ff8028a4.html "$RUNNER_TEMP/website/"
          cd "$RUNNER_TEMP/website"
          sha256sum --check --quiet SHA256SUMS.txt
          test -s index.html
          for page in research publications awards news activities join profile; do
            test -s "$page/index.html"
          done
          rm -rf .github
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/website
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
